<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Budget">
<meta name="theme-color" content="#000000" id="themeColor">
<title>Budget</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000; --surface:#111; --sunk:#1C1C1E; --raise:#2C2C2E; --ink:#F2F2F2; --muted:#8A8A8E; --faint:#4A4A4E; --line:#222224;
  --red:#FF453A; --amber:#FFD60A; --green:#32D74B;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --onink:#000; --r:16px; color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
}
:root[data-theme="light"]{--bg:#F2F2F7;--surface:#FFFFFF;--sunk:#E9E9EF;--raise:#D6D6DD;--ink:#111214;--muted:#6C6C72;--faint:#A8A8B0;--line:#E2E2E8;--red:#E0342A;--amber:#B7791F;--green:#1E9E4A;--onink:#fff;color-scheme:light}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#F2F2F7;--surface:#FFFFFF;--sunk:#E9E9EF;--raise:#D6D6DD;--ink:#111214;--muted:#6C6C72;--faint:#A8A8B0;--line:#E2E2E8;--red:#E0342A;--amber:#B7791F;--green:#1E9E4A;--onink:#fff;color-scheme:light}}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
input,select{outline:none}
input:focus,select:focus{box-shadow:0 0 0 2px var(--ink)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{max-width:540px;margin:0 auto;padding:10px 16px calc(150px + env(safe-area-inset-bottom,0px));overflow-x:clip}

.top{display:flex;justify-content:space-between;align-items:center;margin:4px 0 14px}
h1{font-family:var(--display);font-weight:700;font-size:44px;line-height:1;margin:0}
.icon{width:42px;height:42px;border:0;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center}
.icon svg{width:21px;height:21px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card{background:var(--surface);border-radius:var(--r);padding:16px}
h2{font-size:15px;font-weight:600;color:var(--muted);margin:24px 2px 8px;display:flex;justify-content:space-between}
h2 small{font-weight:500;color:var(--faint)}
.muted{color:var(--muted)}

/* month switch */
.mnav{display:flex;align-items:center;gap:8px;margin:0 0 14px}
.mnav span{flex:1;text-align:center;font-weight:600;font-size:16px}
.mnav .icon{width:38px;height:38px}
.mnav .sub{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.mnav .today{border:0;background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}

/* home */
.hero{padding:20px 18px 18px}
.hero .lab{font-size:14px;color:var(--muted)}
.big{font-family:var(--display);font-weight:700;font-size:84px;line-height:.95;margin:6px 0 2px;font-variant-numeric:tabular-nums;word-break:break-all}
.big small{font-size:28px;color:var(--muted);margin-left:6px}
.big.neg{color:var(--red)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.stat{background:var(--surface);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-family:var(--display);font-weight:700;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.stat.inc b{color:var(--green)}
.pbar{height:6px;border-radius:3px;background:var(--sunk);margin:16px 0 0;overflow:hidden}
.pbar i{display:block;height:100%;border-radius:3px;background:var(--ink)}

/* lists */
.list{background:var(--surface);border-radius:var(--r);overflow:hidden}
.swipe{position:relative;overflow:hidden;background:var(--surface)}
.swipe+.swipe{box-shadow:0 -1px 0 var(--line)}
.sdel{visibility:hidden;background:var(--red);position:absolute;inset:0;display:flex;align-items:center;justify-content:flex-end;padding-right:22px;color:#fff;font-weight:600}
.row{position:relative;width:100%;border:0;background:var(--surface);display:flex;align-items:center;gap:12px;padding:12px 16px;text-align:left;touch-action:pan-y;transition:transform .2s}
.swipe+.swipe .row{box-shadow:inset 0 1px 0 var(--line)}
.row:active{background:var(--sunk)}
.row.drag{transition:none}
.swipe.mv .sdel{visibility:visible}
.emo{flex:none;width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:21px}
.rname{flex:1;min-width:0}
.rname b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rname span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.rval{font-family:var(--display);font-weight:700;font-size:24px;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.rval.inc{color:var(--green)}
.dayh{display:flex;justify-content:space-between;font-size:14px;font-weight:600;color:var(--muted);margin:20px 2px 8px}
.dayh span:last-child{font-weight:500;color:var(--faint)}
.empty{text-align:center;padding:30px 20px;color:var(--muted)}
.empty b{display:block;font-size:18px;color:var(--ink);margin-bottom:4px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:4px}
.filters .inp.q{grid-column:1/-1}
.catbar{width:100%;border:0;background:none;text-align:left;display:flex;align-items:center;gap:12px;padding:12px 16px}
.catbar+.catbar{box-shadow:inset 0 1px 0 var(--line)}
.cbm{flex:1;min-width:0}
.cbm .l{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.cbm .l span:last-child{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.bsub{font-size:12px;color:var(--muted);margin-top:4px}
.cbm .pbar{margin-top:6px;height:6px}

/* fab + tabs */
.fab{position:fixed;right:max(16px, calc((100vw - 540px) / 2 + 16px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border:0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:34px;line-height:1;padding-bottom:3px;background:var(--ink);color:var(--onink);font-weight:500;z-index:4;box-shadow:0 8px 30px rgba(0,0,0,.35)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--bg);box-shadow:0 -1px 0 var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:2;transform:translateZ(0)}
.tabsin{max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:60px;position:relative}
.navind{position:absolute;top:0;left:0;width:25%;height:3px;display:flex;justify-content:center;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.navind::after{content:"";width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--ink)}
.navbtn{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:500;color:var(--faint)}
.navbtn svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.navbtn[aria-current="page"]{color:var(--ink)}

/* charts + goals + lock */
.chartcard{background:var(--surface);border-radius:var(--r);padding:16px}
.donutw{position:relative;width:170px;height:170px;margin:0 auto 10px}
.donutw svg{width:100%;height:100%}
.donutw .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:30px;line-height:1}
.donutw .mid small{font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted);margin-top:3px}
.leg{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:14px}
.leg i{flex:none;width:10px;height:10px;border-radius:50%}
.leg span:nth-child(2){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.leg b{font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums}
.leg em{font-style:normal;color:var(--muted);width:40px;text-align:right;font-size:13px}
.bars{display:block;width:100%;height:auto}
.goal{width:100%;border:0;background:none;text-align:left;display:block;padding:13px 16px}
.goal+.goal{box-shadow:inset 0 1px 0 var(--line)}
.goal:active{background:var(--sunk)}
.goal .l{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.goal .l span:last-child{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.goal .pbar{margin-top:8px}
.goal .bsub{margin-top:5px}
.addm{display:flex;gap:8px}
.addm .btn{flex:none;padding:0 18px;height:46px;font-size:15px}
.lock{position:fixed;inset:0;z-index:20;background:var(--bg);display:none;align-items:center;justify-content:center;padding:20px}
.lock.on{display:flex}
.lin{width:100%;max-width:320px;text-align:center}
.lin h2{display:block;margin:0 0 18px;font-family:var(--display);font-size:32px;color:var(--ink)}
.dots{display:flex;justify-content:center;gap:16px;margin-bottom:26px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--faint)}
.dots i.on{background:var(--ink);border-color:var(--ink)}
.lin .pad button:disabled{visibility:hidden}
/* sheets */
.inp{width:100%;height:46px;border:0;background:var(--sunk);border-radius:12px;padding:0 14px}
select.inp{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 20px,calc(100% - 15px) 20px;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
input[type=date].inp{color-scheme:inherit}
.upc{display:flex;align-items:center;gap:12px;padding:11px 16px}
.upc+.upc{box-shadow:inset 0 1px 0 var(--line)}
.upc .dd{flex:none;width:52px;font-size:13px;color:var(--muted);font-weight:600}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:5;display:flex;align-items:flex-end;justify-content:center;opacity:0;visibility:hidden;transition:opacity .2s,visibility 0s .25s}
.sheet.on{opacity:1;visibility:visible;transition:opacity .2s}
.sheet.s2{z-index:6}
.sbox{background:var(--surface);width:100%;max-width:540px;max-height:94vh;max-height:94dvh;overflow-y:auto;border-radius:22px 22px 0 0;padding:10px 18px 0;transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.sheet.on .sbox{transform:none}
.sbox::before{content:"";display:block;width:36px;height:4px;border-radius:2px;background:var(--raise);margin:0 auto 14px}
.sbox h3{font-family:var(--display);font-weight:700;font-size:30px;margin:0 0 10px}
.sfoot{position:sticky;bottom:0;background:var(--surface);padding:10px 0 calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:8px}
.btn{flex:1;height:50px;border:0;border-radius:14px;background:var(--ink);color:var(--onink);font-weight:600;font-size:17px}
.btn.sec{background:var(--sunk);color:var(--ink);flex:none;padding:0 18px}
.btn.danger{background:var(--sunk);color:var(--red);flex:none;padding:0 18px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:none;height:38px;border-radius:9px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--ink);font-weight:600}
.amount{font-family:var(--display);font-weight:700;font-size:72px;line-height:1;text-align:center;margin:12px 0 4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.amount small{font-size:26px;color:var(--muted);margin-left:6px}
.amount.inc{color:var(--green)}
.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0}
.cat{border:0;background:var(--sunk);border-radius:12px;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);box-shadow:inset 0 0 0 2px transparent;min-width:0}
.cat span{font-size:22px;line-height:1.2}
.cat em{font-style:normal;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--ink);color:var(--ink)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.pad button{height:50px;border:0;border-radius:12px;background:var(--sunk);font-family:var(--display);font-weight:700;font-size:28px}
.pad button:active{background:var(--raise)}
.fl{font-size:13px;color:var(--muted);margin:12px 2px 6px;display:block}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--onink);padding:8px 8px 8px 18px;border-radius:999px;font-size:15px;font-weight:500;display:none;z-index:9;max-width:92vw;align-items:center;gap:10px;white-space:nowrap}
.toast.on{display:flex}
.toast button{border:0;background:rgba(128,128,128,.28);color:inherit;border-radius:999px;padding:5px 12px;font-weight:600;font-size:14px}
.toast.plain{padding-right:18px}
.sw{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin:6px 0}
.sw button{aspect-ratio:1;border:0;border-radius:50%;box-shadow:inset 0 0 0 0 var(--ink)}
.sw button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--ink)}
.note{font-size:13px;color:var(--muted);margin:10px 4px}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.shake{animation:shake .3s}
</style>
</head>
<body>
<div class="wrap" id="view"></div>
<button class="fab" id="fab" aria-label="Ajouter une transaction">+</button>
<nav class="tabs"><div class="tabsin">
  <div class="navind" id="navind"></div>
  <button class="navbtn" data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Accueil</button>
  <button class="navbtn" data-tab="tx"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Transactions</button>
  <button class="navbtn" data-tab="bud"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l6.4 6.4"/></svg>Budgets</button>
  <button class="navbtn" data-tab="more"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg>Plus</button>
</div></nav>
<div class="sheet" id="sh1"><div class="sbox" id="sb1"></div></div>
<div class="sheet s2" id="sh2"><div class="sbox" id="sb2"></div></div>
<div class="lock" id="lock"><div class="lin"><h2 id="lt">Code PIN</h2><div class="dots" id="ldots"><i></i><i></i><i></i><i></i></div>
  <div class="pad" id="lpad"></div><button class="textlink" id="lcancel" style="display:none;margin:10px auto 0;background:none;border:0;color:var(--muted);font-size:15px;padding:8px">Annuler</button></div></div>
<input type="file" id="impfile" accept=".json,application/json" hidden>
<div class="toast" id="toast"></div>

<script>
"use strict";
const KEY = "budget-v1";
const DEF_CATS = [
  {id:"food", name:"Nourriture", emoji:"🍔", color:"#FF9F0A"},
  {id:"transport", name:"Transport", emoji:"🚌", color:"#0A84FF"},
  {id:"fun", name:"Sorties", emoji:"🎉", color:"#BF5AF2"},
  {id:"shop", name:"Shopping", emoji:"🛍️", color:"#FF375F"},
  {id:"subs", name:"Abonnements", emoji:"📱", color:"#64D2FF"},
  {id:"games", name:"Jeux", emoji:"🎮", color:"#30D158"},
  {id:"music", name:"Musique", emoji:"🎧", color:"#FFD60A"},
  {id:"school", name:"École", emoji:"📚", color:"#5E5CE6"},
  {id:"gifts", name:"Cadeaux", emoji:"🎁", color:"#FF6482"},
  {id:"other", name:"Autre", emoji:"✨", color:"#8E8E93"}
];
const COLORS = ["#FF453A","#FF9F0A","#FFD60A","#30D158","#64D2FF","#0A84FF","#5E5CE6","#BF5AF2","#FF375F","#FF6482","#AC8E68","#8E8E93","#63E6BE","#A3E635","#F472B6","#38BDF8"];
const METHODS = [{id:"card", name:"Carte"}, {id:"twint", name:"TWINT"}, {id:"cash", name:"Cash"}];

/* ---------- data ---------- */
let S = load();
function load(){
  let d = null;
  try{ d = JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  if(!d || typeof d !== "object") d = {};
  return migrate(d);
}
// Add a block per format change: if(d.v < 2){ ...; d.v = 2; }
function migrate(d){
  if(!d.v) d.v = 1;
  if(d.v < 2){ d.rec = d.rec || []; d.budgets = d.budgets || {}; d.v = 2; }
  if(d.v < 3){ d.goals = d.goals || []; d.v = 3; }
  d.settings = Object.assign({theme:"auto", startDay:1, pin:""}, d.settings);
  if(!Array.isArray(d.goals)) d.goals = [];
  if(!Array.isArray(d.rec)) d.rec = [];
  if(!d.budgets || typeof d.budgets !== "object") d.budgets = {};
  if(!Array.isArray(d.cats) || !d.cats.length) d.cats = DEF_CATS.map(c => Object.assign({}, c));
  if(!Array.isArray(d.tx)) d.tx = [];
  return d;
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast("Stockage plein, rien n'a été enregistré"); }
}

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const ymd = d => d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
const today = () => ymd(new Date());
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const cents = x => Math.round(x * 100);
const money = n => n.toLocaleString("fr-CH", {minimumFractionDigits: Number.isInteger(n) ? 0 : 2, maximumFractionDigits: 2});
const shiftMonth = (ym, n) => { let [y, m] = ym.split("-").map(Number); const i = m - 1 + n; return (y + Math.floor(i/12)) + "-" + pad(((i % 12) + 12) % 12 + 1); };
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const monthLabel = ym => { const [y, m] = ym.split("-").map(Number); return cap(new Date(y, m-1, 1).toLocaleDateString("fr-CH", {month:"long", year:"numeric"})); };
function dayLabel(ds){
  if(ds === today()) return "Aujourd'hui";
  const y = new Date(); y.setDate(y.getDate()-1);
  if(ds === ymd(y)) return "Hier";
  const [Y, M, D] = ds.split("-").map(Number);
  return cap(new Date(Y, M-1, D).toLocaleDateString("fr-CH", {weekday:"long", day:"numeric", month:"long"}));
}
const catOf = id => S.cats.find(c => c.id === id) || S.cats.find(c => c.id === "other") || {id:"other", name:"Autre", emoji:"✨", color:"#8E8E93"};
const methodName = id => (METHODS.find(m => m.id === id) || METHODS[0]).name;
const sd = () => S.settings.startDay || 1;
// a "month" runs from day startDay of ym to the day before startDay of the next month
const monthStart = ym => ym + "-" + pad(sd());
const monthEnd = ym => shiftMonth(ym, 1) + "-" + pad(sd()); // exclusive
const inMonth = (t, ym) => t.date >= monthStart(ym) && t.date < monthEnd(ym);
function curYm(){ const t = today(); return +t.slice(8) < sd() ? shiftMonth(t.slice(0, 7), -1) : t.slice(0, 7); }
const shortDate = ds => { const [y, m, d] = ds.split("-").map(Number); return new Date(y, m-1, d).toLocaleDateString("fr-CH", {day:"numeric", month:"short"}); };
function periodLabel(ym){
  const e = new Date(monthEnd(ym) + "T00:00:00"); e.setDate(e.getDate() - 1);
  return shortDate(monthStart(ym)) + " – " + shortDate(ymd(e));
}
const EVERY = {week:"Chaque semaine", month:"Chaque mois", year:"Chaque année"};
function addPeriod(ds, every, anchor){
  const [y, m, d] = ds.split("-").map(Number);
  if(every === "week") return ymd(new Date(y, m-1, d + 7));
  const i = m - 1 + (every === "year" ? 12 : 1), Y = y + Math.floor(i / 12), M = i % 12;
  return Y + "-" + pad(M + 1) + "-" + pad(Math.min(anchor || d, new Date(Y, M + 1, 0).getDate()));
}
// adds every recurring payment that is due; returns how many were added
function runRec(){
  const td = today(); let n = 0;
  for(const r of S.rec){
    let guard = 0;
    while(r.next <= td && guard++ < 400){
      S.tx.push({id:uid(), ts:Date.now() + n, type:r.type, amount:r.amount, cat:r.cat, date:r.next, method:r.method, note:r.name, rec:r.id});
      r.next = addPeriod(r.next, r.every, r.day); n++;
    }
  }
  if(n) save();
  return n;
}
function upcoming(days){
  const td = today(), lim = new Date(); lim.setDate(lim.getDate() + days);
  const end = ymd(lim), out = [];
  for(const r of S.rec){
    let d = r.next, g = 0;
    while(d <= end && g++ < 100){ if(d >= td) out.push({r, d}); d = addPeriod(d, r.every, r.day); }
  }
  return out.sort((a, b) => a.d.localeCompare(b.d));
}
const monthTx = ym => S.tx.filter(t => inMonth(t, ym));
const sortTx = a => a.sort((x, y) => y.date.localeCompare(x.date) || (y.ts || 0) - (x.ts || 0));
function totals(list){
  let e = 0, i = 0;
  for(const t of list){ if(t.type === "inc") i += cents(t.amount); else e += cents(t.amount); }
  return {exp: e/100, inc: i/100, bal: (i - e)/100};
}
const tint = c => c + "2E";

function applyTheme(){
  const t = S.settings.theme;
  if(t === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", t);
  const dark = t === "dark" || (t === "auto" && !matchMedia("(prefers-color-scheme: light)").matches);
  $("#themeColor").content = dark ? "#000000" : "#F2F2F7";
}
matchMedia("(prefers-color-scheme: light)").addEventListener("change", applyTheme);

/* ---------- toast ---------- */
let toastTimer;
function toast(msg, undo){
  const el = $("#toast");
  el.className = "toast on" + (undo ? "" : " plain");
  el.innerHTML = "<span>" + esc(msg) + "</span>" + (undo ? '<button id="undo">Annuler</button>' : "");
  if(undo) $("#undo").onclick = () => { undo(); el.className = "toast"; };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.className = "toast", undo ? 5000 : 2200);
}

function fillTxList(){
  const q = filt.q.trim().toLowerCase();
  const list = sortTx(monthTx(cur).filter(t =>
    (!filt.cat || t.cat === filt.cat) && (!filt.method || t.method === filt.method) &&
    (!q || (t.note || "").toLowerCase().includes(q) || catOf(t.cat).name.toLowerCase().includes(q) || String(t.amount).includes(q.replace(",", ".")))));
  if(!list.length){
    $("#txlist").innerHTML = emptyBox("Aucune transaction", (filt.q || filt.cat || filt.method) ? "Essaie d'autres filtres." : "Appuie sur + pour en ajouter une.");
    return;
  }
  const groups = [];
  for(const t of list){
    const g = groups[groups.length-1];
    if(g && g.d === t.date) g.l.push(t); else groups.push({d:t.date, l:[t]});
  }
  $("#txlist").innerHTML = groups.map(g => {
    const sp = totals(g.l).exp;
    return '<div class="dayh"><span>' + dayLabel(g.d) + '</span><span>' + (sp ? "−" + money(sp) : "") + '</span></div><div class="list">' + g.l.map(txRow).join("") + '</div>';
  }).join("");
}

function donut(rows, total){
  let off = 25;
  const segs = rows.filter(r => r.v > 0).map(r => {
    const p = r.v / total * 100;
    const el = '<circle cx="21" cy="21" r="15.9155" fill="none" stroke="' + r.c.color + '" stroke-width="5" stroke-dasharray="' + p + ' ' + (100 - p) + '" stroke-dashoffset="' + off + '"/>';
    off -= p; return el;
  }).join("");
  return '<svg viewBox="0 0 42 42" role="img" aria-label="Dépenses par catégorie"><circle cx="21" cy="21" r="15.9155" fill="none" style="stroke:var(--sunk)" stroke-width="5"/>' + segs + '</svg>';
}
function barsChart(){
  const ms = [-5, -4, -3, -2, -1, 0].map(k => shiftMonth(cur, k));
  const vals = ms.map(ym => totals(S.tx.filter(t => t.type !== "inc" && inMonth(t, ym))).exp);
  const max = Math.max(1, ...vals);
  const bars = ms.map((ym, i) => {
    const h = Math.max(vals[i] ? 3 : 1, vals[i] / max * 96), x = 12 + i * 48, y = 122 - h;
    const [Y, M] = ym.split("-").map(Number);
    const lab = new Date(Y, M - 1, 1).toLocaleDateString("fr-CH", {month:"short"}).replace(".", "");
    return '<rect x="' + x + '" y="' + y + '" width="30" height="' + h + '" rx="6" style="fill:' + (i === 5 ? "var(--ink)" : "var(--raise)") + '"/>' +
      (vals[i] ? '<text x="' + (x + 15) + '" y="' + (y - 5) + '" text-anchor="middle" font-size="10" style="fill:var(--muted)">' + Math.round(vals[i]) + '</text>' : '') +
      '<text x="' + (x + 15) + '" y="138" text-anchor="middle" font-size="11" style="fill:var(--muted)">' + esc(lab) + '</text>';
  }).join("");
  return '<svg class="bars" viewBox="0 0 300 146" role="img" aria-label="Dépenses des 6 derniers mois">' + bars + '</svg>';
}
function viewBud(){
  const list = monthTx(cur).filter(t => t.type !== "inc");
  const by = {};
  for(const t of list) by[t.cat] = (by[t.cat] || 0) + cents(t.amount);
  const rows = S.cats.map(c => ({c, v:(by[c.id] || 0)/100, b:S.budgets[c.id] || 0}));
  for(const id in by) if(!S.cats.some(c => c.id === id)) rows.push({c:catOf(id), v:by[id]/100, b:0});
  rows.sort((a, b) => (b.b > 0) - (a.b > 0) || b.v - a.v);
  const withB = rows.filter(r => r.b > 0);
  const tb = withB.reduce((a, r) => a + cents(r.b), 0) / 100, ts = withB.reduce((a, r) => a + cents(r.v), 0) / 100;
  const total = totals(list).exp;
  const row = r => {
    const pct = r.b ? r.v / r.b : 0;
    const col = !r.b ? r.c.color : pct > 1 ? "var(--red)" : pct >= .8 ? "var(--amber)" : r.c.color;
    const right = r.b ? '<span' + (pct > 1 ? ' style="color:var(--red)"' : '') + '>' + money(r.v) + ' / ' + money(r.b) + '</span>' : '<span>' + (r.v ? money(r.v) : '<span class="muted" style="font-size:14px;font-family:var(--body)">Définir</span>') + '</span>';
    const sub = r.b ? (pct > 1 ? '<div class="bsub" style="color:var(--red)">Dépassé de ' + money(Math.round((r.v - r.b) * 100) / 100) + ' CHF</div>' : '<div class="bsub">Il reste ' + money(Math.round((r.b - r.v) * 100) / 100) + ' CHF</div>') : '';
    return '<button class="catbar" data-bud="' + esc(r.c.id) + '"><span class="emo" style="background:' + tint(r.c.color) + '">' + esc(r.c.emoji) + '</span><div class="cbm"><div class="l"><span>' + esc(r.c.name) + '</span>' + right + '</div>' +
      '<div class="pbar"><i style="width:' + (r.b ? Math.min(100, pct * 100) : (total ? r.v / total * 100 : 0)) + '%;background:' + col + '"></i></div>' + sub + '</div></button>';
  };
  return '<div class="top"><h1>Budgets</h1></div>' + monthNav() +
    (withB.length ? '<div class="card"><div class="muted" style="font-size:14px">Budget total du mois</div><div class="big" style="font-size:52px;margin-top:2px">' + money(ts) + '<small style="font-size:22px">/ ' + money(tb) + ' CHF</small></div></div>' : '') +
    (total > 0 ? '<h2>Répartition<small>' + money(total) + ' CHF</small></h2><div class="chartcard"><div class="donutw">' + donut(rows, total) + '<div class="mid">' + money(total) + '<small>CHF</small></div></div>' +
      rows.filter(r => r.v > 0).sort((a, b) => b.v - a.v).map(r => '<div class="leg"><i style="background:' + r.c.color + '"></i><span>' + esc(r.c.emoji + " " + r.c.name) + '</span><b>' + money(r.v) + '</b><em>' + Math.round(r.v / total * 100) + ' %</em></div>').join("") + '</div>' : '') +
    '<h2>6 derniers mois<small>dépenses en CHF</small></h2><div class="chartcard">' + barsChart() + '</div>' +
    '<h2>Par catégorie<small>' + money(total) + ' CHF dépensés</small></h2>' +
    '<div class="list">' + rows.map(row).join("") + '</div>' +
    '<p class="note">Touche une catégorie pour fixer son budget mensuel. La barre devient jaune à 80 % et rouge au-delà de 100 %.</p>';
}

/* swipe left to delete */
let swiped = false;
(function(){
  let el, row, x0, y0, dx, lock;
  const v = $("#view");
  v.addEventListener("touchstart", e => {
    const s = e.target.closest(".swipe"); if(!s) return;
    el = s; row = s.querySelector(".row"); x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; dx = 0; lock = null;
  }, {passive:true});
  v.addEventListener("touchmove", e => {
    if(!el) return;
    const t = e.touches[0], mx = t.clientX - x0, my = t.clientY - y0;
    if(lock === null && (Math.abs(mx) > 8 || Math.abs(my) > 8)) lock = Math.abs(mx) > Math.abs(my) ? "x" : "y";
    if(lock !== "x") return;
    dx = Math.min(0, mx); el.classList.add("mv"); row.classList.add("drag"); row.style.transform = "translateX(" + dx + "px)";
  }, {passive:true});
  v.addEventListener("touchend", () => {
    if(!el) return;
    row.classList.remove("drag");
    if(lock === "x"){
      const sw = el; setTimeout(() => sw.classList.remove("mv"), 220);
      swiped = true; setTimeout(() => swiped = false, 350);
      if(dx < -Math.min(110, el.offsetWidth * 0.3)){ const id = el.dataset.id; row.style.transform = "translateX(-110%)"; setTimeout(() => delTx(id), 180); }
      else row.style.transform = "";
    }
    el = null;
  });
})();

let F = null;
function openTx(id){
  const t = id && S.tx.find(x => x.id === id);
  F = t ? {id:t.id, type:t.type, amt:String(t.amount), cat:t.cat, date:t.date, method:t.method, note:t.note || ""}
        : {id:null, type:"exp", amt:"", cat:"food", date:today(), method:"card", note:""};
  if(!S.cats.some(c => c.id === F.cat)) F.cat = "other";
  renderTx();
  $("#sh1").classList.add("on");
}
function closeTx(){ $("#sh1").classList.remove("on"); F = null; document.activeElement && document.activeElement.blur(); }
function renderTx(){
  const inc = F.type === "inc";
  $("#sb1").innerHTML =
    '<div class="seg" id="tseg"><button data-type="exp" aria-pressed="' + !inc + '">Dépense</button><button data-type="inc" aria-pressed="' + inc + '">Revenu</button></div>' +
    '<div class="amount ' + (inc ? "inc" : "") + '" id="amt"></div>' +
    '<div class="cats">' + S.cats.map(c => '<button class="cat" data-c="' + esc(c.id) + '" aria-pressed="' + (F.cat === c.id) + '"><span>' + esc(c.emoji) + '</span><em>' + esc(c.name) + '</em></button>').join("") + '</div>' +
    '<div class="pad">' + ["1","2","3","4","5","6","7","8","9",",","0","⌫"].map(k => '<button data-k="' + k + '" aria-label="' + (k === "⌫" ? "Effacer" : k) + '">' + k + '</button>').join("") + '</div>' +
    '<span class="fl">Moyen de paiement</span><div class="seg">' + METHODS.map(m => '<button data-meth="' + m.id + '" aria-pressed="' + (F.method === m.id) + '">' + m.name + '</button>').join("") + '</div>' +
    '<span class="fl">Date</span><input class="inp" type="date" id="fdate" value="' + F.date + '">' +
    '<span class="fl">Note (facultatif)</span><input class="inp" id="fnote" maxlength="80" placeholder="Ex. Pizza avec les potes" value="' + esc(F.note) + '">' +
    '<div class="sfoot">' + (F.id ? '<button class="btn danger" id="fdel">Supprimer</button>' : '<button class="btn sec" id="fcancel">Annuler</button>') +
    '<button class="btn" id="fsave">' + (F.id ? "Enregistrer" : "Ajouter") + '</button></div>';
  showAmt();
}
function showAmt(){ $("#amt").innerHTML = esc((F.amt || "0").replace(".", ",")) + "<small>CHF</small>"; }
function key(k){
  let a = F.amt;
  if(k === "⌫") a = a.slice(0, -1);
  else if(k === ","){ if(!a.includes(".")) a = (a || "0") + "."; }
  else {
    const dot = a.indexOf(".");
    if(dot >= 0 && a.length - dot > 2) return;
    if(a.replace(".", "").length >= 8) return;
    a = a === "0" ? k : a + k;
  }
  F.amt = a; showAmt();
}
function saveTx(){
  const v = Math.round(parseFloat(F.amt) * 100) / 100;
  if(!(v > 0)){ const el = $("#amt"); el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); return; }
  const rec = {type:F.type, amount:v, cat:F.cat, date:F.date || today(), method:F.method, note:F.note.trim()};
  if(F.id){ Object.assign(S.tx.find(x => x.id === F.id), rec); toast("Modifié"); }
  else { S.tx.push(Object.assign({id:uid(), ts:Date.now()}, rec)); toast("Ajouté"); }
  save(); closeTx(); render();
}
function delTx(id){
  const i = S.tx.findIndex(x => x.id === id); if(i < 0) return;
  const t = S.tx.splice(i, 1)[0];
  save(); render();
  toast("Transaction supprimée", () => { S.tx.push(t); save(); render(); });
}
$("#sb1").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.type){ F.type = b.dataset.type; renderTx(); }
  else if(b.dataset.c){ F.cat = b.dataset.c; renderTx(); }
  else if(b.dataset.meth){ F.method = b.dataset.meth; renderTx(); }
  else if(b.dataset.k) key(b.dataset.k);
  else if(b.id === "fsave") saveTx();
  else if(b.id === "fcancel") closeTx();
  else if(b.id === "fdel"){ const id = F.id; closeTx(); delTx(id); }
});
$("#sb1").addEventListener("input", e => {
  if(e.target.id === "fnote") F.note = e.target.value;
  if(e.target.id === "fdate") F.date = e.target.value;
});
$("#sh1").addEventListener("click", e => { if(e.target.id === "sh1") closeTx(); });

/* keyboard: digits, comma, backspace, Enter saves, Escape closes */
document.addEventListener("keydown", e => {
  if($("#lock").classList.contains("on")){
    if(/^[0-9]$/.test(e.key)) lockKey(e.key); else if(e.key === "Backspace") lockKey("⌫"); else if(e.key === "Escape") $("#lcancel").click();
    return;
  }
  if(e.key === "Escape"){
    if($("#sh2").classList.contains("on")) closeCat(); else if(F) closeTx();
    return;
  }
  if(!F || $("#sh2").classList.contains("on")) return;
  const typing = e.target.tagName === "INPUT" || e.target.tagName === "SELECT";
  if(e.key === "Enter"){
    if(e.target.tagName === "BUTTON" && e.target.id !== "fsave" && !typing) return;
    e.preventDefault(); saveTx(); return;
  }
  if(typing || e.ctrlKey || e.metaKey || e.altKey) return;
  if(/^[0-9]$/.test(e.key)) key(e.key);
  else if(e.key === "," || e.key === ".") key(",");
  else if(e.key === "Backspace") key("⌫");
});

/* ---------- category sheet ---------- */
let CF = null;
function openCat(id){
  const c = id === "new" ? {id:null, name:"", emoji:"", color:COLORS[5]} : S.cats.find(x => x.id === id);
  if(!c) return;
  CF = Object.assign({}, c);
  $("#sb2").innerHTML =
    '<h3>' + (CF.id ? "Modifier la catégorie" : "Nouvelle catégorie") + '</h3>' +
    '<span class="fl">Nom</span><input class="inp" id="cname" maxlength="20" value="' + esc(CF.name) + '" placeholder="Ex. Sport">' +
    '<span class="fl">Emoji</span><input class="inp" id="cemoji" maxlength="8" value="' + esc(CF.emoji) + '" placeholder="Ex. ⚽">' +
    '<span class="fl">Couleur</span><div class="sw" id="csw">' + COLORS.map(k => '<button data-col="' + k + '" style="background:' + k + '" aria-pressed="' + (CF.color === k) + '" aria-label="Couleur"></button>').join("") + '</div>' +
    '<div class="sfoot">' + (CF.id && CF.id !== "other" && S.cats.length > 1 ? '<button class="btn danger" id="cdel">Supprimer</button>' : '<button class="btn sec" id="ccancel">Annuler</button>') +
    '<button class="btn" id="csave">Enregistrer</button></div>';
  $("#sh2").classList.add("on");
}
function closeCat(){ $("#sh2").classList.remove("on"); CF = null; }
$("#sb2").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.col){ CF.color = b.dataset.col; document.querySelectorAll("#csw button").forEach(x => x.setAttribute("aria-pressed", x === b)); }
  else if(b.id === "ccancel") closeCat();
  else if(b.id === "csave"){
    const name = $("#cname").value.trim(), emoji = $("#cemoji").value.trim() || "🏷️";
    if(!name){ $("#cname").focus(); return; }
    if(CF.id){ Object.assign(S.cats.find(x => x.id === CF.id), {name, emoji, color:CF.color}); }
    else S.cats.push({id:"c" + uid(), name, emoji, color:CF.color});
    save(); closeCat(); render();
  }
  else if(b.id === "cdel"){
    const n = S.tx.filter(t => t.cat === CF.id).length;
    if(n && !confirm(n + " transaction" + (n > 1 ? "s seront déplacées" : " sera déplacée") + " vers « Autre ». Supprimer la catégorie ?")) return;
    if(!S.cats.some(c => c.id === "other")) S.cats.push({id:"other", name:"Autre", emoji:"✨", color:"#8E8E93"});
    S.tx.forEach(t => { if(t.cat === CF.id) t.cat = "other"; });
    S.rec.forEach(r => { if(r.cat === CF.id) r.cat = "other"; });
    delete S.budgets[CF.id];
    S.cats = S.cats.filter(c => c.id !== CF.id);
    save(); closeCat(); render();
  }
});
$("#sb2").addEventListener("keydown", e => { if(e.key === "Enter" && e.target.tagName === "INPUT"){ e.preventDefault(); (document.querySelector("#csave,#rsave,#bsave,#gsave") || {click(){}}).click(); } });
$("#sh2").addEventListener("click", e => { if(e.target.id === "sh2") closeCat(); });

/* ---------- recurring + budget sheets ---------- */
let RF = null;
function openRec(id){
  const r = id === "new" ? {id:null, type:"exp", name:"", amount:"", cat:"subs", method:"card", every:"month", next:today()} : S.rec.find(x => x.id === id);
  if(!r) return;
  RF = Object.assign({}, r, {amount:r.amount ? String(r.amount) : ""});
  renderRec();
  $("#sh2").classList.add("on");
}
function readRec(){
  if(!$("#rname")) return;
  RF.name = $("#rname").value; RF.amount = $("#ramt").value;
  RF.cat = $("#rcat").value; RF.method = $("#rmeth").value; RF.every = $("#revery").value; RF.next = $("#rnext").value;
}
function renderRec(){
  const inc = RF.type === "inc";
  $("#sb2").innerHTML =
    '<h3>' + (RF.id ? "Paiement récurrent" : "Nouveau paiement récurrent") + '</h3>' +
    '<div class="seg"><button data-rtype="exp" aria-pressed="' + !inc + '">Dépense</button><button data-rtype="inc" aria-pressed="' + inc + '">Revenu</button></div>' +
    '<span class="fl">Nom</span><input class="inp" id="rname" maxlength="40" placeholder="Ex. Spotify, argent de poche" value="' + esc(RF.name) + '">' +
    '<span class="fl">Montant (CHF)</span><input class="inp" id="ramt" inputmode="decimal" placeholder="0" value="' + esc(RF.amount.replace(".", ",")) + '">' +
    '<span class="fl">Répétition</span><select class="inp" id="revery">' + Object.keys(EVERY).map(k => '<option value="' + k + '"' + (RF.every === k ? " selected" : "") + '>' + EVERY[k] + '</option>').join("") + '</select>' +
    '<span class="fl">Prochaine date</span><input class="inp" type="date" id="rnext" value="' + RF.next + '">' +
    '<div class="two"><div><span class="fl">Catégorie</span><select class="inp" id="rcat">' + S.cats.map(c => '<option value="' + esc(c.id) + '"' + (RF.cat === c.id ? " selected" : "") + '>' + esc(c.emoji + " " + c.name) + '</option>').join("") + '</select></div>' +
    '<div><span class="fl">Paiement</span><select class="inp" id="rmeth">' + METHODS.map(m => '<option value="' + m.id + '"' + (RF.method === m.id ? " selected" : "") + '>' + m.name + '</option>').join("") + '</select></div></div>' +
    '<p class="note">Quand la date arrive, le paiement est ajouté tout seul à tes transactions à l\'ouverture de l\'app. Si la date est déjà passée, il sera ajouté tout de suite.</p>' +
    '<div class="sfoot">' + (RF.id ? '<button class="btn danger" id="rdel">Supprimer</button>' : '<button class="btn sec" id="rcancel">Annuler</button>') + '<button class="btn" id="rsave">Enregistrer</button></div>';
}
function saveRec(){
  readRec();
  const amount = Math.round(parseFloat(RF.amount.replace(",", ".")) * 100) / 100;
  const name = RF.name.trim();
  if(!name){ $("#rname").focus(); return; }
  if(!(amount > 0)){ $("#ramt").focus(); return; }
  if(!RF.next) RF.next = today();
  const rec = {type:RF.type, name, amount, cat:RF.cat, method:RF.method, every:RF.every, next:RF.next, day:+RF.next.slice(8)};
  if(RF.id) Object.assign(S.rec.find(x => x.id === RF.id), rec); else S.rec.push(Object.assign({id:uid()}, rec));
  const n = runRec();
  save(); closeCat(); render();
  toast(n ? n + " paiement" + (n > 1 ? "s ajoutés" : " ajouté") + " aux transactions" : "Enregistré");
}
function delRec(){
  const i = S.rec.findIndex(x => x.id === RF.id); if(i < 0) return;
  const r = S.rec.splice(i, 1)[0];
  save(); closeCat(); render();
  toast("Paiement récurrent supprimé", () => { S.rec.push(r); save(); render(); });
}
let BF = null;
function openBud(id){
  const c = catOf(id), cur0 = S.budgets[id];
  BF = id;
  $("#sb2").innerHTML =
    '<h3>Budget · ' + esc(c.emoji + " " + c.name) + '</h3>' +
    '<span class="fl">Montant par mois (CHF)</span><input class="inp" id="bamt" inputmode="decimal" placeholder="Ex. 100" value="' + (cur0 ? String(cur0).replace(".", ",") : "") + '">' +
    '<div class="sfoot">' + (cur0 ? '<button class="btn danger" id="bdel">Retirer</button>' : '<button class="btn sec" id="bcancel">Annuler</button>') + '<button class="btn" id="bsave">Enregistrer</button></div>';
  $("#sh2").classList.add("on");
  setTimeout(() => $("#bamt") && $("#bamt").focus(), 320);
}
$("#sb2").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.rtype){ readRec(); RF.type = b.dataset.rtype; renderRec(); }
  else if(b.id === "rsave") saveRec();
  else if(b.id === "rcancel") closeCat();
  else if(b.id === "rdel") delRec();
  else if(b.id === "bcancel") closeCat();
  else if(b.id === "bdel"){ delete S.budgets[BF]; save(); closeCat(); render(); }
  else if(b.id === "bsave"){
    const v = Math.round(parseFloat($("#bamt").value.replace(",", ".")) * 100) / 100;
    if(!(v > 0)){ $("#bamt").focus(); return; }
    S.budgets[BF] = v; save(); closeCat(); render();
  }
});

/* ---------- savings goals ---------- */
let GF = null;
const num = v => Math.round(parseFloat(String(v).replace(",", ".")) * 100) / 100;
function openGoal(id){
  const g = id === "new" ? {id:null, name:"", target:"", saved:0} : S.goals.find(x => x.id === id);
  if(!g) return;
  GF = g.id;
  const left = g.id ? Math.max(0, Math.round((g.target - g.saved) * 100) / 100) : 0;
  $("#sb2").innerHTML =
    '<h3>' + (g.id ? esc(g.name) : "Nouvel objectif") + '</h3>' +
    (g.id ? '<div class="muted" id="gleft" style="margin:-6px 0 6px">' + (left ? "Encore " + money(left) + " CHF" : "Objectif atteint 🎉") + '</div>' +
      '<span class="fl">Ajouter de l\'argent (CHF)</span><div class="addm"><input class="inp" id="gadd" inputmode="decimal" placeholder="Ex. 20 (ou -20 pour retirer)"><button class="btn" id="gaddbtn">Ajouter</button></div>' : '') +
    '<span class="fl">Nom</span><input class="inp" id="gname" maxlength="40" placeholder="Ex. Nouveau téléphone" value="' + esc(g.name) + '">' +
    '<div class="two"><div><span class="fl">Objectif (CHF)</span><input class="inp" id="gtarget" inputmode="decimal" value="' + (g.target ? String(g.target).replace(".", ",") : "") + '"></div>' +
    '<div><span class="fl">Déjà mis de côté</span><input class="inp" id="gsaved" inputmode="decimal" value="' + String(g.saved).replace(".", ",") + '"></div></div>' +
    '<div class="sfoot">' + (g.id ? '<button class="btn danger" id="gdel">Supprimer</button>' : '<button class="btn sec" id="gcancel">Annuler</button>') + '<button class="btn" id="gsave">Enregistrer</button></div>';
  $("#sh2").classList.add("on");
}
$("#sb2").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  if(b.id === "gcancel") closeCat();
  else if(b.id === "gsave"){
    const name = $("#gname").value.trim(), target = num($("#gtarget").value), saved = num($("#gsaved").value || 0);
    if(!name){ $("#gname").focus(); return; }
    if(!(target > 0)){ $("#gtarget").focus(); return; }
    const rec = {name, target, saved: saved >= 0 ? saved : 0};
    if(GF) Object.assign(S.goals.find(x => x.id === GF), rec); else S.goals.push(Object.assign({id:uid()}, rec));
    save(); closeCat(); render();
  }
  else if(b.id === "gdel"){
    const i = S.goals.findIndex(x => x.id === GF); if(i < 0) return;
    const g = S.goals.splice(i, 1)[0];
    save(); closeCat(); render();
    toast("Objectif supprimé", () => { S.goals.push(g); save(); render(); });
  }
  else if(b.id === "gaddbtn"){
    const v = num($("#gadd").value);
    if(!v){ $("#gadd").focus(); return; }
    const g = S.goals.find(x => x.id === GF);
    g.saved = Math.max(0, Math.round((g.saved + v) * 100) / 100);
    save(); render();
    $("#gsaved").value = String(g.saved).replace(".", ","); $("#gadd").value = "";
    const left = Math.max(0, Math.round((g.target - g.saved) * 100) / 100);
    $("#gleft").textContent = left ? "Encore " + money(left) + " CHF" : "Objectif atteint 🎉";
    toast(v > 0 ? "+" + money(v) + " CHF" : money(v) + " CHF");
  }
});

/* ---------- export / import ---------- */
function download(name, text, mime){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], {type:mime})); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function exportJson(){
  const d = JSON.parse(JSON.stringify(S)); d.settings.pin = ""; // the PIN stays on this phone
  download("budget-" + today() + ".json", JSON.stringify(d, null, 1), "application/json");
  toast("Sauvegarde exportée");
}
function exportCsv(){
  const q = v => '"' + String(v).replace(/"/g, '""') + '"';
  const safe = v => /^[=+\-@\t\r]/.test(v) ? "'" + v : v; // stops Excel from running a note as a formula
  const lines = [["Date", "Type", "Catégorie", "Montant (CHF)", "Moyen", "Note"].map(q).join(";")];
  for(const t of sortTx(S.tx.slice()).reverse()){
    const amt = (t.type === "inc" ? 1 : -1) * t.amount;
    lines.push([t.date, t.type === "inc" ? "Revenu" : "Dépense", catOf(t.cat).name, String(amt).replace(".", ","), methodName(t.method), safe(t.note || "")].map(q).join(";"));
  }
  download("budget-" + today() + ".csv", "\ufeff" + lines.join("\r\n"), "text/csv;charset=utf-8");
  toast("CSV exporté");
}
$("#impfile").addEventListener("change", e => {
  const f = e.target.files[0]; e.target.value = "";
  if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    let d;
    try{ d = JSON.parse(r.result); }catch(x){ d = null; }
    if(!d || typeof d !== "object" || !Array.isArray(d.tx) || !Array.isArray(d.cats)){ toast("Ce fichier n'est pas une sauvegarde Budget"); return; }
    if(!confirm("Remplacer tes données actuelles (" + S.tx.length + " transactions) par la sauvegarde (" + d.tx.length + " transactions) ?")) return;
    const pin = S.settings.pin;
    d.tx = d.tx.filter(t => t && typeof t.date === "string" && t.amount > 0);
    S = migrate(d); S.settings.pin = pin;
    save(); applyTheme(); cur = curYm(); render(); toast("Sauvegarde importée");
  };
  r.readAsText(f);
});

/* ---------- PIN ---------- */
const hashPin = p => { let h = 5381; for(const c of "bgt" + p) h = ((h << 5) + h + c.charCodeAt(0)) | 0; return String(h); };
let LM = null, LB = "";
function showLock(mode, cb){
  LM = {mode, cb, first:""}; LB = "";
  $("#lpad").innerHTML = ["1","2","3","4","5","6","7","8","9","","0","⌫"].map(k => '<button data-lk="' + k + '"' + (k ? "" : " disabled") + ' aria-label="' + (k === "⌫" ? "Effacer" : k) + '">' + k + '</button>').join("");
  $("#lcancel").style.display = mode === "unlock" ? "none" : "block";
  drawLock(); $("#lock").classList.add("on");
}
function drawLock(){
  $("#lt").textContent = LM.mode === "set" ? (LM.first ? "Confirme le code" : "Nouveau code") : LM.mode === "check" ? "Code actuel" : "Code PIN";
  document.querySelectorAll("#ldots i").forEach((d, i) => d.classList.toggle("on", i < LB.length));
}
function lockKey(k){
  if(k === "⌫") LB = LB.slice(0, -1); else if(LB.length < 4) LB += k;
  drawLock();
  if(LB.length === 4) setTimeout(lockSubmit, 120);
}
function lockFail(){
  const el = $("#ldots"); el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake");
  LB = ""; drawLock();
}
function lockSubmit(){
  if(!LM || LB.length < 4) return;
  const m = LM.mode;
  if(m === "unlock" || m === "check"){
    if(hashPin(LB) !== S.settings.pin) return lockFail();
    const cb = LM.cb; $("#lock").classList.remove("on"); LM = null; if(cb) cb();
  } else if(!LM.first){ LM.first = LB; LB = ""; drawLock(); }
  else if(LM.first === LB){ S.settings.pin = hashPin(LB); save(); $("#lock").classList.remove("on"); LM = null; render(); toast("Code PIN activé"); }
  else { LM.first = ""; lockFail(); toast("Les deux codes sont différents"); }
}
$("#lpad").addEventListener("click", e => { const b = e.target.closest("[data-lk]"); if(b && b.dataset.lk) lockKey(b.dataset.lk); });
$("#lcancel").onclick = () => { $("#lock").classList.remove("on"); LM = null; };
function act(a){
  if(a === "json") exportJson();
  else if(a === "csv") exportCsv();
  else if(a === "import") $("#impfile").click();
  else if(a === "pinon") showLock("set");
  else if(a === "pinchg") showLock("check", () => showLock("set"));
  else if(a === "pinoff") showLock("check", () => { S.settings.pin = ""; save(); render(); toast("Code PIN désactivé"); });
}
let hiddenAt = 0;
document.addEventListener("visibilitychange", () => {
  if(document.hidden){ hiddenAt = Date.now(); return; }
  if(S.settings.pin && Date.now() - hiddenAt > 15000 && !$("#lock").classList.contains("on")){
    document.querySelectorAll(".sheet.on").forEach(x => x.classList.remove("on")); F = null; CF = RF = null;
    showLock("unlock");
  }
});

/* ---------- start ---------- */
applyTheme();
function autoRec(){
  const n = runRec();
  if(n){ cur = curYm(); render(); toast(n + " paiement" + (n > 1 ? "s récurrents ajoutés" : " récurrent ajouté")); }
}
autoRec();
render();
if(S.settings.pin) showLock("unlock");
document.addEventListener("visibilitychange", () => { if(!document.hidden && !F) autoRec(); });
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
